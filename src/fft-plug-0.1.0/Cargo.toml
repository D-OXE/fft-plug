[package]
name = "fft-plug"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A real-time PipeWire spectrum visualizer for niri and Wayland"
license = "MIT"
readme = "README.md"

[features]
default = ["desktop"]
desktop = [
    "dep:gl",
    "dep:glib-unix",
    "dep:gtk4",
    "dep:gtk4-layer-shell",
    "dep:libc",
    "dep:pipewire",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
realfft = "3.5"
rustfft = "6.4"

gl = { version = "0.14", optional = true }
glib-unix = { version = "0.22", optional = true }
gtk4 = { version = "0.11", optional = true }
gtk4-layer-shell = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
pipewire = { version = "0.10", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
checked_conversions = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
